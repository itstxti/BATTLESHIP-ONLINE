<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Battleship"
  />

  <title>Battleship</title>
</head>

<body>
  <div id="app">

    <header class="game-header">
      <!-- Game Controls -->

      <div class="game-topbar">

        <!-- Back to menu -->

        <button
          id="back-to-menu"
          class="game-icon-button"
          type="button"
          aria-label="Back to main menu"
          title="Back to main menu"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M19 12H5"
            />

            <path
              d="M12 19l-7-7 7-7"
            />
          </svg>
        </button>


        <!-- Sound controls -->

        <div class="sound-controls">

          <button
            id="sound-toggle"
            class="game-icon-button"
            type="button"
            aria-label="Open sound settings"
            aria-expanded="false"
            title="Sound settings"
          >

            <svg
              id="sound-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M11 5L6 9H3v6h3l5 4V5z"
              />

              <path
                d="M15.5 8.5a5 5 0 010 7"
              />

              <path
                d="M18 6a9 9 0 010 12"
              />
            </svg>

          </button>


          <!-- Sound panel -->

          <div
            id="sound-panel"
            class="sound-panel"
            hidden
          >

            <div class="sound-panel-header">
              <span>
                SOUND
              </span>
            </div>


            <div class="sound-control">

              <div class="sound-control-label">
                <span>
                  Music
                </span>

                <span id="music-volume-value">
                  30%
                </span>
              </div>

              <input
                id="music-volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.3"
                aria-label="Music volume"
              />

            </div>


            <div class="sound-control">

              <div class="sound-control-label">
                <span>
                  Effects
                </span>

                <span id="sfx-volume-value">
                  70%
                </span>
              </div>

              <input
                id="sfx-volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.7"
                aria-label="Effects volume"
              />

            </div>


            <button
              id="sound-mute"
              class="sound-mute-button"
              type="button"
            >
              Mute
            </button>

          </div>

        </div>

      </div>
      <h1>BATTLESHIP</h1>
      <p class="subtitle">Sink the enemy fleet</p>
    </header>


    <!-- Game Mode Selection -->

    <section
      id="game-mode-menu"
      class="game-mode-menu"
    >

      <div class="game-mode-header">
        <span class="game-mode-eyebrow">
          GAME MODE
        </span>

        <h2>
          Choose your battle
        </h2>

        <p>
          Select how you want to play.
        </p>
      </div>


      <div class="game-mode-options">

        <button
          id="mode-ai"
          class="game-mode-button"
          type="button"
        >
          <span class="game-mode-number">
            01
          </span>

          <span class="game-mode-content">
            <span class="game-mode-title">
              Solo
            </span>

            <span class="game-mode-description">
              Battle against the AI
            </span>
          </span>

          <span class="game-mode-arrow">
            →
          </span>
        </button>


        <button
          id="mode-local"
          class="game-mode-button"
          type="button"
        >
          <span class="game-mode-number">
            02
          </span>

          <span class="game-mode-content">
            <span class="game-mode-title">
              Local Multiplayer
            </span>

            <span class="game-mode-description">
              Two players · Same device
            </span>
          </span>

          <span class="game-mode-arrow">
            →
          </span>
        </button>


        <button
          id="mode-online"
          class="game-mode-button"
          type="button"
        >
          <span class="game-mode-number">
            03
          </span>

          <span class="game-mode-content">
            <span class="game-mode-title">
              Online Multiplayer
            </span>

            <span class="game-mode-description">
              Play with friends online
            </span>
          </span>

          <span class="game-mode-arrow">
            →
          </span>
        </button>

      </div>

    </section>


    <!-- Local multiplayer: hand-off screen -->

    <section
      id="pass-device-screen"
      class="game-mode-menu"
      hidden
    ></section>


    <!-- Online multiplayer: lobby -->

    <section
      id="online-screen"
      class="game-mode-menu"
      hidden
    ></section>


    <!-- Game -->

    <main
      id="game-screen"
      class="game-container"
      hidden
    >

      <!-- Turn status -->

      <section class="game-status">
        <span id="turn-status">
          Your turn
        </span>
      </section>


      <!-- Game layout -->

      <section class="game-layout">

        <!-- Player Fleet -->

        <div class="fleet-section">

          <h3>
            Your Fleet
          </h3>

          <div
            id="player-fleet"
            class="fleet-list"
          ></div>

        </div>


        <!-- Player Board -->

        <div class="board-section">

          <h2>
            Your Fleet
          </h2>

          <div
            id="player-board"
            class="board"
          ></div>

        </div>


        <!-- Enemy Board -->

        <div class="board-section">

          <h2>
            Enemy Fleet
          </h2>

          <div
            id="enemy-board"
            class="board"
          ></div>

        </div>


        <!-- Enemy Fleet -->

        <div class="fleet-section">

          <h3>
            Enemy Fleet
          </h3>

          <div
            id="enemy-fleet"
            class="fleet-list"
          ></div>

        </div>

      </section>


      <!-- Placement controls -->

      <div class="placement-controls">

        <button
          id="rotate-ship"
          class="placement-button"
          type="button"
        >
          Rotate
        </button>

        <button
          id="reset-fleet"
          class="placement-button secondary"
          type="button"
        >
          Reset Fleet
        </button>

      </div>


      <button
        id="new-game"
        class="new-game-button"
        type="button"
      >
        Start Battle
      </button>

    </main>

  </div>


  <script
    type="module"
    src="/src/main.ts"
  ></script>

</body>

</html>
