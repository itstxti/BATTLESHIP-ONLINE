<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
    </linearGradient>

    <!-- Ship -->
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="shadow"
            x="-30%"
            y="-20%"
            width="160%"
            height="160%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="14"
        flood-color="#001D4A"
        flood-opacity="0.45"/>
    </filter>

    <!-- Subtle grid -->
    <pattern id="grid"
             width="64"
             height="64"
             patternUnits="userSpaceOnUse">
      <path
        d="M64 0H0V64"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- App icon background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#bg)"/>

  <!-- Battleship grid -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#grid)"/>

  <!-- Ship -->
  <g filter="url(#shadow)">

    <!-- Main hull -->
    <path
      d="
        M256 64
        C282 64 298 112 298 160
        L298 364
        C298 417 283 444 256 444
        C229 444 214 417 214 364
        L214 160
        C214 112 230 64 256 64
        Z"
      fill="url(#ship)"/>

    <!-- Bridge -->
    <rect
      x="226"
      y="176"
      width="60"
      height="72"
      rx="14"
      fill="#C7CED7"/>

    <!-- Bridge window -->
    <rect
      x="238"
      y="190"
      width="36"
      height="30"
      rx="8"
      fill="#64748B"/>

    <!-- Deck detail -->
    <rect
      x="240"
      y="270"
      width="32"
      height="82"
      rx="12"
      fill="#B8C1CB"/>

    <!-- Front gun -->
    <rect
      x="248"
      y="104"
      width="16"
      height="62"
      rx="8"
      fill="#B8C1CB"/>

    <!-- Rear gun -->
    <rect
      x="248"
      y="350"
      width="16"
      height="48"
      rx="8"
      fill="#B8C1CB"/>
  </g>

  <!-- Target -->
  <g
    fill="none"
    stroke="#FF3B30"
    stroke-width="9"
    stroke-linecap="round">

    <!-- Target ring -->
    <circle
      cx="256"
      cy="256"
      r="69"/>

    <!-- Crosshair -->
    <path d="M256 166V202"/>
    <path d="M256 310V346"/>
    <path d="M166 256H202"/>
    <path d="M310 256H346"/>
  </g>

  <!-- Hit -->
  <circle
    cx="256"
    cy="256"
    r="15"
    fill="#FF3B30"
    stroke="#FFFFFF"
    stroke-width="4"/>
</svg>

