<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- iOS App Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#004FB0" />
    </linearGradient>

    <!-- Subtle Material Gradient for the Ship -->
    <linearGradient id="shipMaterial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>

    <!-- iOS Drop Shadow for the main glyph -->
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001D4A" flood-opacity="0.4" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="bgGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <line x1="64" y1="0" x2="64" y2="64" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
      <line x1="0" y1="64" x2="64" y2="64" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
    </pattern>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" />
  
  <!-- Grid overlay -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrid)" />

  <!-- Ship Silhouette (Top-Down view) -->
  <g filter="url(#appleShadow)">
    <!-- Main Hull -->
    <path d="M 256,70 
             C 280,70 295,120 295,160 
             L 295,380 
             C 295,430 280,442 256,442 
             C 232,442 217,430 217,380 
             L 217,160 
             C 217,120 232,70 256,70 Z" 
          fill="url(#shipMaterial)" />

    <!-- Minimalist Deck Lines (Negative Space) -->
    <rect x="248" y="140" width="16" height="40" rx="8" fill="#001D4A" opacity="0.15" />
    <rect x="254" y="110" width="4" height="35" rx="2" fill="#001D4A" opacity="0.15" /> <!-- Front Barrel -->

    <rect x="236" y="210" width="40" height="92" rx="12" fill="#001D4A" opacity="0.15" />
    <rect x="246" y="230" width="20" height="52" rx="10" fill="#001D4A" opacity="0.25" />

    <rect x="248" y="332" width="16" height="40" rx="8" fill="#001D4A" opacity="0.15" />
    <rect x="254" y="367" width="4" height="35" rx="2" fill="#001D4A" opacity="0.15" /> <!-- Rear Barrel -->
  </g>

  <!-- Target / Crosshair -->
  <g stroke="#FF3B30" stroke-linecap="round">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="64" fill="none" stroke-width="6" opacity="0.9" />
    
    <!-- Crosshair Ticks -->
    <line x1="256" y1="172" x2="256" y2="204" stroke-width="8" />
    <line x1="256" y1="308" x2="256" y2="340" stroke-width="8" />
    <line x1="172" y1="256" x2="204" y2="256" stroke-width="8" />
    <line x1="308" y1="256" x2="340" y2="256" stroke-width="8" />
  </g>

  <!-- Center Dot (The 'Hit') -->
  <circle cx="256" cy="256" r="12" fill="#FF3B30" stroke="#FFFFFF" stroke-width="3" />
</svg>
